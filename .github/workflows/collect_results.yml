name: Collect 30R race results
on:
  push:
    branches: [main]
    paths:
      - 'collect_results.py'
      - '.github/workflows/collect_results.yml'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python collect_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: results-30r
          path: |
            race_results_30r.csv
            payouts_30r.csv
            results_collection_status.csv
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add race_results_30r.csv payouts_30r.csv results_collection_status.csv
          git diff --cached --quiet && exit 0
          git commit -m 'Collect 30R race results dataset'
          git push
